[project]
name = "gewu-server"
version = "0.1.0"
description = "gewu 校园问答 Agent 服务端（P14 起 Python + LangGraph，行为契约 docs/PARITY.md）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary,pool]>=3.2",
    "langchain-openai>=0.3",
    "langchain-core>=0.3",
    "httpx>=0.27",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langchain>=1.4",
    "argon2-cffi>=23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gewu"]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.8",
]

# 包源显式声明：本机网络对 pypi.org TLS 持续阻断，清华镜像全量可用（uv.lock 随之固化）
[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# 契约原文（提示词逐字对照 Go / DDL 移植自 schema.go）不可改写，超长行豁免
"gewu/rag/schema.py" = ["E501"]
"gewu/rag/retrieve.py" = ["E501"]
"gewu/agent/prompts.py" = ["E501"]
"gewu/agent/tx.py" = ["E501"]
"gewu/agent/txmeta.py" = ["E501"]
"gewu/agent/graph.py" = ["E501"]
"gewu/agent/guardrails.py" = ["E501"]
"gewu/agent/agenttools.py" = ["E501"]
"gewu/business/db.py" = ["E501"]
"gewu/memory.py" = ["E501"]
"gewu/agent/routing_prompts.py" = ["E501"]
"tests/test_routing.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
