// 检索服务：混合检索（BM25 + 向量 RRF，PARITY §7.5~7.7）+ 摄入流水线（P3）+ 长期记忆（P5）。
// 检索实现复用冻结库 internal/rag（tokenize/BM25/RRF 原样）；查询改写与 embed 走 generate RPC。
syntax = "proto3";

package gewu.rag.v1;

option go_package = "gewu/pkg/gen/gewu/rag/v1;ragv1";

// Hit 一条检索命中（对齐冻结单体 rag.Hit；doc 元信息缺失时 title=doc_id、source=""）。
message Hit {
  int32 chunk_id = 1;
  string doc_id = 2;
  int32 seq = 3;
  string text = 4;
  string title = 5;
  string source = 6;
}

message SearchRequest {
  string query = 1;
  int32 k = 2; // <=0 时服务端取缺省 RETRIEVAL_K=6
}

message SearchResponse {
  repeated Hit hits = 1; // 已按融合排序
}

message DocInfo {
  string doc_id = 1;
  string title = 2;
  string source = 3;
  string updated = 4;
  int32 chunks = 5;
}

message ListDocsRequest {}

message ListDocsResponse {
  repeated DocInfo docs = 1; // 按 doc_id 升序
}

message StatsRequest {}

message StatsResponse {
	int32 docs = 1;
	int32 chunks = 2;
	bool embedded = 3; // 库中是否有向量
}

// 摄入（P3）：流水线走 Redis Streams，Ingest RPC 保持阻塞语义
// （发布后等待完成回执，超时报错）——评测与 A/B 需要确定性索引状态。
message IngestRequest {
	bool no_embed = 1; // 只建 BM25
	bool rebuild = 2;  // 清空后重建
}

message IngestResponse {
	string line = 1;             // 进度行（逐文档）
	bool done = 2;               // 全部完成（stats 有效）
	StatsResponse stats = 3;     // done 时索引规模
	string error = 4;            // 失败原因（done 且失败时）
	bool embedded = 5;           // 本轮是否完成向量化
}

message UploadRequest {
	string filename = 1; // *.md
	bytes content = 2;
}

message UploadResponse {
	string doc_id = 1;
}

// RagService 知识检索与摄入。
service RagService {
	rpc Search(SearchRequest) returns (SearchResponse);
	rpc ListDocs(ListDocsRequest) returns (ListDocsResponse);
	rpc Stats(StatsRequest) returns (StatsResponse);
	// Ingest 阻塞式全量入库（CLI：make ingest-ms；corpus 目录由服务侧读取）。
	rpc Ingest(IngestRequest) returns (stream IngestResponse);
	// Upload 异步上传（新增演示面：发布单个文档的摄入任务，立即返回）。
	rpc Upload(UploadRequest) returns (UploadResponse);

	// ---------- 长期记忆（P5；与知识 collection 分离，共用 embedding 管线） ----------
	//
	// 注意：Recall/Put 预留为独立 API，**默认不接入答案生成**（各轮独立作答
	// 是 26/26 行为前提，ADR-0005）；接入与否迁移完成后单独评估。

	// MemoryPut 写入一条长期记忆（文本 → embed → 记忆向量库）。
	rpc MemoryPut(MemoryPutRequest) returns (MemoryPutResponse);
	// MemoryRecall 按语义检索记忆（无向量时降级为 BM25/最近写入，见实现注释）。
	rpc MemoryRecall(MemoryRecallRequest) returns (MemoryRecallResponse);
}

// MemoryItem 一条长期记忆。
message MemoryItem {
	string id = 1;    // 服务端生成的记忆 ID
	string text = 2;
	double score = 3; // Recall 时的相似度
}

message MemoryPutRequest {
	string session_id = 1; // 归属会话（隔离维度）
	string text = 2;       // 1~2000 字
}

message MemoryPutResponse {
	string id = 1;
}

message MemoryRecallRequest {
	string session_id = 1; // 限定会话范围
	string query = 2;      // 1~500 字
	int32 k = 3;           // 缺省 5，上限 20
}

message MemoryRecallResponse {
	repeated MemoryItem items = 1;
}
