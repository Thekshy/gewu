// 工具服务：工具注册中心 + 权限矩阵（PARITY §10）+ mock 业务系统宿主（PARITY §8）。
// 敏感参数 user 一律从 gRPC metadata（x-user）读取、由服务端注入，
// 调用方（模型/客户端）不可传——权限判定与业务归属的单一事实源。
syntax = "proto3";

package gewu.tool.v1;

option go_package = "gewu/pkg/gen/gewu/tool/v1;toolv1";

// CallToolRequest 工具调用。args 只含业务参数（venue/date/slot/…）。
message CallToolRequest {
  string tool = 1;
  map<string, string> args = 2;
  string role = 3; // student | counselor（权限矩阵判定）
}

// CallToolResponse 对齐冻结单体 business.Result。
// error: "" | invalid | quota | conflict | not_found | permission | unknown_tool | missing_arg
message CallToolResponse {
  bool ok = 1;
  string error = 2;
  string field = 3;             // 字段级失败（编排侧据此回到 collect 重新追问）
  string message = 4;
  string receipt = 5;           // VE-XXXX / LV-XXXX，空串 = 无
  repeated string alternatives = 6; // 冲突时有余量的时段（按 SLOTS 固定序）
  int32 days = 7;               // submit_leave 成功时的天数
  string approver = 8;          // submit_leave 成功时的审批层级
}

message Venue {
  string venue_id = 1;
  string name = 2;
  string kind = 3;
  int32 capacity = 4;
}

message ToolDescriptionsRequest {
  string role = 1;
}

message ToolDescriptionsResponse {
  // 该角色可见工具清单：`- {name}：{description}` 换行连接（给 LLM 选工具用，顺序=工具表序）。
  string descriptions = 1;
}

message ListVenuesRequest {}

message ListVenuesResponse {
  repeated Venue venues = 1; // 按 id 升序
}

message VenueByNameRequest {
  string text = 1; // 名称子串匹配（编排侧槽位解析用）
}

message VenueByNameResponse {
  Venue venue = 1; // nil = 未匹配
  bool found = 2;
}

message ResetRequest {}

message ResetResponse {}

message BookingView {
  string booking_id = 1; // VE-XXXX
  string venue = 2;
  string date = 3;
  string slot = 4;
  string user = 5;
}

message TicketView {
  string ticket = 1; // LV-XXXX
  string user = 2;
  string leave_type = 3;
  string start = 4;
  string end = 5;
  int32 days = 6;
  string approver = 7;
  string status = 8;
}

message OverviewRequest {}

message OverviewResponse {
  repeated BookingView bookings = 1; // 有效预约按 id 升序（评测断言依赖）
  repeated TicketView tickets = 2;   // 全部请假单按 id 升序
}

// ToolService 工具执行与业务系统。
service ToolService {
  // CallTool 单一出口：未知工具/越权/缺参在进入业务系统前拦截（文案逐字见 PARITY §10）。
  rpc CallTool(CallToolRequest) returns (CallToolResponse);
  rpc ToolDescriptions(ToolDescriptionsRequest) returns (ToolDescriptionsResponse);
  rpc ListVenues(ListVenuesRequest) returns (ListVenuesResponse);
  rpc VenueByName(VenueByNameRequest) returns (VenueByNameResponse);
  // Reset 清空 bookings 与 leave_tickets（场馆保留），/api/business/reset 转发至此。
  rpc Reset(ResetRequest) returns (ResetResponse);
  // Overview /api/business/overview 转发至此（评测断言依赖）。
  rpc Overview(OverviewRequest) returns (OverviewResponse);
}
