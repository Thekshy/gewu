// 编排服务：会话编排管线（PARITY §4）——续轮意图 → 路由 → 五分支分发。
// gateway 把 HTTP /api/chat 转为本 RPC 并把事件流逐帧转成 SSE。
// trace-id 经 gRPC metadata（x-trace-id）贯穿，不在请求体内传递。
syntax = "proto3";

package gewu.orchestrator.v1;

option go_package = "gewu/pkg/gen/gewu/orchestrator/v1;orchestratorv1";

// ChatRequest 一轮问答请求（字段与 PARITY §2.4 的 chat 请求体一致，校验在 gateway 完成）。
message ChatRequest {
  string question = 1;   // 1~500 字
  string mode = 2;       // auto | direct | research
  string session_id = 3; // <=64 字符，缺省 "default"
  string role = 4;       // student | counselor；user 由服务端派生 demo-{role}
}

// ArgPair 确认摘要的有序参数对。pending_action.args 的插入序（中文标签 → 值）
// 是展示契约（PARITY §9.3.3），必须用 repeated KV 而非 map/Struct。
message ArgPair {
  string key = 1;
  string value = 2;
}

// Citation 引用条目（citations 事件 items 元素，PARITY §3）。
message Citation {
  int32 n = 1;
  string doc_id = 2;
  string title = 3;
  string source = 4;
}

// ChatResponse SSE 事件流的一帧：oneof 对应 PARITY §3 的事件类型全集。
message ChatResponse {
  oneof kind {
    RouteEvent route = 1;
    StatusEvent status = 2;
    StepEvent step = 3;
    AnswerDeltaEvent answer_delta = 4;
    CitationsEvent citations = 5;
    SlotQuestionEvent slot_question = 6;
    PendingActionEvent pending_action = 7;
    ActionResultEvent action_result = 8;
    ErrorEvent error = 9;
    DoneEvent done = 10;
  }
}

message RouteEvent {
  string route = 1;  // factual | research | refusal | transaction | hybrid
  string reason = 2;
  bool by_llm = 3;
}

message StatusEvent {
  string text = 1;
}

message StepEvent {
  int32 index = 1; // 1 起
  string subquestion = 2;
  repeated string sources = 3; // 前三命中去重后的 title 列表
}

message AnswerDeltaEvent {
  string text = 1;
}

message CitationsEvent {
  repeated Citation items = 1; // 空也必须是空数组语义（无命中时发空 items）
}

message SlotQuestionEvent {
  string slot = 1;
  string question = 2;
}

message PendingActionEvent {
  string tool = 1;
  string label = 2;
  repeated ArgPair args = 3; // 有序，见 ArgPair 注释
}

message ActionResultEvent {
  string tool = 1;
  bool success = 2;
  string message = 3;
  string receipt = 4; // 空串 = 无凭证（SSE 端表现为 null）
}

message ErrorEvent {
  string message = 1;
}

message DoneEvent {
  int64 latency_ms = 1; // t0 = 编排入口（决策 B），与冻结单体 RunChat 口径一致
}

// ChatService 会话编排。
service ChatService {
  // Chat 一轮问答，服务端流式返回事件（route → … → done）。
  // 客户端断开 → ctx 取消 → 全链路取消传播到 generate 的 provider 请求。
  rpc Chat(ChatRequest) returns (stream ChatResponse);
}

// AgentConfig 编排配置（默认行 = 冻结单体 internal/agent/prompts.go 逐字快照）。
message AgentConfig {
  string router_system = 1;       // 五分类路由提示词
  string slot_extract_system = 2; // 槽位抽取提示词
  string planner_system = 3;      // 深研拆解提示词
  string answer_system = 4;       // 引用式作答提示词
}

message GetConfigRequest {}

message GetConfigResponse {
  AgentConfig config = 1;
  bool is_default = 2; // 是否默认行（未被 /admin 修改过）
}

message SetConfigRequest {
  AgentConfig config = 1; // 空字段保持不变
}

message SetConfigResponse {
  AgentConfig config = 1; // 更新后的生效配置
}

// ConfigService 编排配置管理（gateway /admin/* 转发至此；新增命名空间，
// 不触碰既有 /api/* 契约）。热路径读走 Redis 缓存，零配置 RPC。
service ConfigService {
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);
  rpc SetConfig(SetConfigRequest) returns (SetConfigResponse);
}
