// 生成服务：LLM 网关（provider 接口 + 模型分层）+ 每日 token 预算集中计量。
// PARITY §13 全参数复刻；降级决策留在调用方（orchestrator/rag）。
syntax = "proto3";

package gewu.generate.v1;

option go_package = "gewu/pkg/gen/gewu/generate/v1;generatev1";

// Message 一条对话消息（system/user/assistant）。
message Message {
  string role = 1;
  string content = 2;
}

// Options 单次补全调节参数（对齐冻结单体 llm.Options）。
// max_tokens<=0 时服务端补 2048；small=true 走辅助小模型。
message Options {
  bool json_mode = 1;
  double temperature = 2;
  int32 max_tokens = 3;
  bool small = 4;
}

message ChatRequest {
  repeated Message messages = 1;
  Options options = 2;
}

message ChatResponse {
  string content = 1;
}

message ChatStreamRequest {
  repeated Message messages = 1;
  // 流式只用于主答案生成，永远主模型；Options 中 small 被忽略。
  Options options = 2;
}

message ChatStreamResponse {
  string text = 1; // 文本增量
}

message EmbedRequest {
  repeated string texts = 1;
}

message Vector {
  repeated double values = 1;
}

message EmbedResponse {
  repeated Vector vectors = 1; // 按输入顺序返回
}

message BudgetStatusRequest {}

message BudgetStatusResponse {
  int64 used = 1;   // 今日已用（UTC 日期滚动）
  int64 limit = 2;
  bool has_key = 3; // 是否配置 LLM_API_KEY（零 key 演示模式判定）
}

// GenerateService LLM 网关。
//
// 错误约定：
// - 未配 key 直接调用 → FAILED_PRECONDITION，message「未配置 LLM_API_KEY，无法调用模型」；
// - 预算耗尽（调用前预检）→ RESOURCE_EXHAUSTED，message 为逐字中文文案
//   「今日 token 预算已用尽（上限 {limit}），请明天再试」（调用方按现状语义降级/透传）；
// - 超时/网络错误向上抛（INTERNAL/DEADLINE_EXCEEDED 等），降级决策留在调用方；
// - 重试策略：仅连接失败且请求未发出重试 1 次，流式不自动重试（ADR）。
service GenerateService {
  rpc Chat(ChatRequest) returns (ChatResponse);
  rpc ChatStream(ChatStreamRequest) returns (stream ChatStreamResponse);
  rpc Embed(EmbedRequest) returns (EmbedResponse);
  rpc BudgetStatus(BudgetStatusRequest) returns (BudgetStatusResponse);
}
